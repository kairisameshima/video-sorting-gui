[project]
name = "video-sorting-gui"
version = "0.1.0"
description = "A video sorting application with React frontend and FastAPI backend"
authors = [
    {name = "User"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.21.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.2",
    "aiofiles>=23.1.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
